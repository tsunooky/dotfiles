# Ly Configuration (Matugen Template)
# Only the background is dynamic (using TTY color 0)
# All other colors are kept as default/white

# Allow empty password or not when authenticating
allow_empty_password = true
animation = none
animation_timeout_sec = 0
asterisk = *
auth_fails = 10
battery_id = null
auto_login_service = ly-autologin
auto_login_session = null
auto_login_user = null

# Colors
# bg = 0 uses the color defined in ly-colors.sh via printf
bg = 0
# fg = 7 uses the color defined as white in ly-colors.sh
fg = 7
border_fg = 7
error_bg = 0
error_fg = 1
cmatrix_fg = 7
gameoflife_fg = 7

# Disable full_color to rely on the TTY palette (printf)
full_color = false

clock = null
default_input = login
input_len = 34
lang = en
ly_log = /var/log/ly.log
session_log = .local/state/ly-session.log
margin_box_h = 2
margin_box_v = 1
path = /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
restart_key = F2
restart_cmd = /sbin/shutdown -r now
shutdown_key = F1
shutdown_cmd = /sbin/shutdown -h now
save = true
service_name = ly
setup_cmd = /etc/ly/setup.sh
text_in_center = false
x_cmd = /usr/bin/X
xauth_cmd = /usr/bin/xauth
xinitrc = ~/.xinitrc
waylandsessions = /usr/share/wayland-sessions
xsessions = /usr/share/xsessions
